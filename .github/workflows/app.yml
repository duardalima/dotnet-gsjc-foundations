name: Dotnet App Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: './dotnet-gsjc-foundation.csproj'
  PUBLISH_PATH: './publish'

jobs:
  build:
    name: Build / Test 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$PROJECT_PATH" --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-build --output "$PUBLISH_PATH"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy application
        run: |
          echo "Deploying the published application from $PUBLISH_PATH"
          echo "Configure the provider-specific deployment command in this step."